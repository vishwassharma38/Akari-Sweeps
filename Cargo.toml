[package]
name = "akari-sweeps"
version = "0.1.0"
edition = "2024"
description = "A small Windows maintenance TUI featuring Akari."
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
image = "0.25"

# Self-updater (GitHub Releases). The updater uses a blocking HTTP client in
# its own worker/CLI paths so the TUI is never blocked by network activity.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
