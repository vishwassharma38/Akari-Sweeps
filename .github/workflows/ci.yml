name: CI

on:
  push:
    branches:
      - akari-sweep-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and installer validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check locked dependencies
        run: cargo check --locked

      - name: Run Rust tests
        run: cargo test --locked

      - name: Validate standalone installer syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install-release.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw "install-release.ps1 has PowerShell parse errors: $($errors -join '; ')"
          }

      - name: Run standalone installer tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File 'tests\install-release.tests.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone installer tests failed with exit code $LASTEXITCODE."
          }
