name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x86_64 release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate Cargo version and tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'akari-sweeps' })
          if ($package.Count -ne 1) {
            throw "Expected exactly one 'akari-sweeps' package in Cargo metadata."
          }
          $cargoVersion = $package[0].version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') {
            throw "Release tags must match v* (got '$tag')."
          }
          $tagVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "Tag '$tag' does not match the Cargo.toml package version '$cargoVersion'."
          }
          Write-Host "Cargo.toml version: $cargoVersion"
          Write-Host "Release tag:        $tag"
          "version=$cargoVersion" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = 'akari-sweeps-windows-x86_64.zip'
          $staging = Join-Path $env:RUNNER_TEMP 'akari-sweeps-release'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/akari-sweeps.exe' `
            -Destination (Join-Path $staging 'akari-sweeps.exe')
          Copy-Item -LiteralPath 'assets' -Destination (Join-Path $staging 'assets') -Recurse

          $zipPath = Join-Path $dist $packageName
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          } finally {
            $archive.Dispose()
          }
          if ($names -notcontains 'akari-sweeps.exe') {
            throw "The release ZIP is missing 'akari-sweeps.exe'."
          }
          if ($names -notcontains 'assets/akari/sweep/akari_sweep_001.png') {
            throw 'The release ZIP is missing the Akari sprite assets.'
          }
          $developmentFiles = @($names | Where-Object {
            $_ -like '*.pdb' -or $_ -like '*.rs' -or $_ -like 'Cargo.*' -or $_ -like 'src/*'
          })
          if ($developmentFiles.Count -gt 0) {
            throw "The release ZIP contains development files: $($developmentFiles -join ', ')"
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $dist "$packageName.sha256"
          $checksumLine = "$hash  $packageName" + [Environment]::NewLine
          [IO.File]::WriteAllText(
            $checksumPath,
            $checksumLine,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host "Created $zipPath"
          Get-Content -LiteralPath $checksumPath

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'dist/akari-sweeps-windows-x86_64.zip'
          $checksum = 'dist/akari-sweeps-windows-x86_64.zip.sha256'
          gh release create $env:GITHUB_REF_NAME $zip $checksum `
            --verify-tag `
            --title "Akari-Sweeps $env:CARGO_VERSION" `
            --generate-notes
