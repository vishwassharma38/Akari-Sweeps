name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x86_64 release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate Cargo version and tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'akari-sweeps' })
          if ($package.Count -ne 1) {
            throw "Expected exactly one 'akari-sweeps' package in Cargo metadata."
          }
          $cargoVersion = $package[0].version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') {
            throw "Release tags must match v* (got '$tag')."
          }
          $tagVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "Tag '$tag' does not match the Cargo.toml package version '$cargoVersion'."
          }
          Write-Host "Cargo.toml version: $cargoVersion"
          Write-Host "Release tag:        $tag"
          "version=$cargoVersion" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: cargo test --locked

      - name: Validate standalone installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install-release.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw "install-release.ps1 has PowerShell parse errors: $($errors -join '; ')"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File 'tests\install-release.tests.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone installer tests failed with exit code $LASTEXITCODE."
          }

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = 'akari-sweeps-windows-x86_64.zip'
          $staging = Join-Path $env:RUNNER_TEMP 'akari-sweeps-release'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/akari-sweeps.exe' `
            -Destination (Join-Path $staging 'akari-sweeps.exe')
          Copy-Item -LiteralPath 'assets' -Destination (Join-Path $staging 'assets') -Recurse

          $zipPath = Join-Path $dist $packageName
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          } finally {
            $archive.Dispose()
          }
          if ($names -notcontains 'akari-sweeps.exe') {
            throw "The release ZIP is missing 'akari-sweeps.exe'."
          }
          if ($names -notcontains 'assets/akari/sweep/akari_sweep_001.png') {
            throw 'The release ZIP is missing the Akari sprite assets.'
          }
          $developmentFiles = @($names | Where-Object {
            $_ -like '*.pdb' -or $_ -like '*.rs' -or $_ -like 'Cargo.*' -or $_ -like 'src/*'
          })
          if ($developmentFiles.Count -gt 0) {
            throw "The release ZIP contains development files: $($developmentFiles -join ', ')"
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $dist "$packageName.sha256"
          $checksumLine = "$hash  $packageName" + [Environment]::NewLine
          [IO.File]::WriteAllText(
            $checksumPath,
            $checksumLine,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Copy-Item -LiteralPath 'install-release.ps1' `
            -Destination (Join-Path $dist 'install-release.ps1') -Force

          # Build a self-contained setup bundle and attach it to every
          # GitHub Release. The itch.io page links to the stable
          # /releases/latest/download/ URL, so it always serves the newest
          # stable bundle without re-uploading or editing the itch.io page.
          $itchStage = Join-Path $env:RUNNER_TEMP 'akari-sweeps-itchio'
          if (Test-Path -LiteralPath $itchStage) {
            Remove-Item -LiteralPath $itchStage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $itchStage -Force | Out-Null
          Copy-Item -LiteralPath $zipPath -Destination $itchStage
          Copy-Item -LiteralPath $checksumPath -Destination $itchStage
          Copy-Item -LiteralPath (Join-Path $dist 'install-release.ps1') -Destination $itchStage
          Copy-Item -LiteralPath 'ITCHIO-INSTALL.txt' -Destination (Join-Path $itchStage 'INSTALL.txt')

          $itchBundleName = 'akari-sweeps-itchio-setup.zip'
          $itchBundlePath = Join-Path $dist $itchBundleName
          if (Test-Path -LiteralPath $itchBundlePath) {
            Remove-Item -LiteralPath $itchBundlePath -Force
          }
          Compress-Archive -Path (Join-Path $itchStage '*') -DestinationPath $itchBundlePath -CompressionLevel Optimal

          $itchArchive = [IO.Compression.ZipFile]::OpenRead($itchBundlePath)
          try {
            $itchNames = @($itchArchive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          } finally {
            $itchArchive.Dispose()
          }
          $requiredItchFiles = @(
            'akari-sweeps-windows-x86_64.zip',
            'akari-sweeps-windows-x86_64.zip.sha256',
            'install-release.ps1',
            'INSTALL.txt'
          )
          foreach ($requiredFile in $requiredItchFiles) {
            if ($itchNames -notcontains $requiredFile) {
              throw "The itch.io setup bundle is missing '$requiredFile'."
            }
          }
          if ($itchNames.Count -ne $requiredItchFiles.Count) {
            throw "The itch.io setup bundle contains unexpected files: $($itchNames -join ', ')"
          }

          Write-Host "Created $zipPath"
          Write-Host "Created $(Join-Path $dist 'install-release.ps1')"
          Write-Host "Created $itchBundlePath"
          Get-Content -LiteralPath $checksumPath

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'dist/akari-sweeps-windows-x86_64.zip'
          $checksum = 'dist/akari-sweeps-windows-x86_64.zip.sha256'
          $installer = 'dist/install-release.ps1'
          $itchBundle = 'dist/akari-sweeps-itchio-setup.zip'
          gh release create $env:GITHUB_REF_NAME $zip $checksum $installer $itchBundle `
            --verify-tag `
            --title "Akari-Sweeps $env:CARGO_VERSION" `
            --generate-notes
